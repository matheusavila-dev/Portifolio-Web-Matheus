    <div class="tools"><button class="ic" data-act="lang" aria-label="${t.aLang}"><span class="${s.lang === "pt" ? "on" : ""}">PT</span>/<span class="${s.lang === "en" ? "on" : ""}">EN</span></button>
    <button class="ic" data-act="theme" aria-label="${t.aTheme}">${this.svg("moon", "moon")}${this.svg("sun", "sun")}</button>
    <button class="ic burger" data-act="menu" aria-label="${t.aMenu}" aria-expanded="false" aria-controls="nav">${this.svg("menu")}</button></div></div>`;

      : title ? `<span class="lnk off">${t.soon}</span>` : `<a class="lnk" href="#projetos">${t.pView}</a>`;
    return this.rv(`<article class="card"><div class="thumb${p.img ? " has" : ""}"${p.img && p.bg ? ` style="background:${p.bg}"` : ""}>${p.img ? `<img src="${p.img}" alt="${title}" loading="lazy">` : t.imgPh}</div><h3>${title || t.pTitle}</h3><p>${desc || t.pDesc}</p>
    <ul class="chips">${p.tech.length ? p.tech.map(x => `<li>${x}</li>`).join("") : `<li class="mu">${t.pTech}</li>`}</ul>
    ${link}</article>`, (i % 3) * .1);
  },
  home(t, s) {
    const c = Model.cfg, nex = `<a class="nx" href="${c.nex}" target="_blank" rel="noopener">nex<span class="p">7</span>step</a>`;
    const skills = Model.skills.map((k, i) => {

    }).join("");
    const info = [["tel", `tel:+${c.wa}`, t.tel, c.phone], ["ml", `mailto:${c.email}`, t.fMail, c.email], ["ig", c.instagram, "Instagram", "@matheusavila.dev"], ["li", c.linkedin, "LinkedIn", "Matheus Ávila"], ["gh", c.github, "GitHub", "matheusavila-dev"], ["pr", "#outros-projetos", t.prT, t.otherP]]
      .map(([k, h, l, v]) => `<a href="${h}"${h.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}><span class="si">${this.svg(k)}</span><span><small>${l}</small>${v}</span></a>`).join("");
    return `<section id="inicio" class="hero" data-sec><div class="wrap hg">
      ${this.rv(`<span class="eyebrow">${t.eyebrow}</span><h1>Matheus <em>Ávila</em></h1><p class="role">${t.role}</p><p class="lead">${t.lead}</p><div class="cta"><a class="btn" href="#projetos">${t.c1}</a><a class="btn o" href="#contato">${t.c2}</a></div>`)}
      ${this.rv(`<div class="code" aria-hidden="true"><div class="dots"><b></b><b></b><b></b></div><code><s>// matheus.js</s>
<i>const</i> dev = {
  name: "Matheus Ávila",
  role: "Full Stack",
  stack: ["React", "Node.js"],
  focus: "UX + APIs",
};</code></div>`, .15)}</div></section>
    <section id="sobre" class="alt" data-sec><div class="wrap ab">
      ${this.rv(`<div class="pw"><div class="photo">${c.photo ? `<img src="${c.photo}" alt="${c.name}">` : `<div>${this.svg("user")}<p>${t.photoPh}</p></div>`}</div></div>`)}
      ${this.rv(`<h2>${t.aboutT}</h2><p>${t.a1.replace("{nex}", nex)}</p><p>${t.a2}</p><a class="btn" href="#outros-projetos">${t.more}</a>`, .12)}</div></section>
    <section id="habilidades" data-sec><div class="wrap">${this.rv(`<div class="head"><h2>${t.skT}</h2><p class="sub">${t.skS}</p></div>`)}<div class="grid sk">${skills}</div></div></section>
    <section id="projetos" class="alt" data-sec><div class="wrap">${this.rv(`<div class="head"><h2>${t.prT}</h2><p class="sub">${t.prS}</p></div>`)}<div class="grid g4">${Model.projects.map((p, i) => this.card(p, t, i)).join("")}</div>
      <div class="ctr rv"><a class="btn o gh" href="${c.github}" target="_blank" rel="noopener">${this.svg("gh")}${t.gh}</a></div></div></section>
    <section id="contato" data-sec><div class="wrap">${this.rv(`<div class="head"><h2>${t.ctT}</h2><p class="sub">${t.ctS}</p></div>`)}<div class="cg">
      ${this.rv(`<form id="cf" class="card"><div class="r2"><div><label for="n">${t.fName}</label><input id="n" name="name" autocomplete="name" required></div><div><label for="p">${t.fPhone}</label><input id="p" name="phone" type="tel" autocomplete="tel"></div></div>
      <label for="e">${t.fMail}</label><input id="e" name="email" type="email" autocomplete="email"><label for="m">${t.fMsg}</label><textarea id="m" name="message" required></textarea>
      <div class="btns"><button type="button" class="btn" data-act="mail">${t.sMail}</button><button type="button" class="btn o" data-act="wa">${t.sWa}</button></div></form>`)}
      ${this.rv(`<div class="info">${info}</div>`, .12)}</div></div></section>`;
  },
  more(t) {
    return `<section class="alt"><div class="wrap">${this.rv(`<div class="head"><h2>${t.moT}</h2><p class="sub">${t.moS}</p></div>`)}<div class="grid">${Model.more.map((p, i) => this.card(p, t, i)).join("")}</div>
    <div class="ctr rv"><a class="btn o" href="#sobre">${t.back}</a></div></div></section>`;
  },
  footer(t) {
    const c = Model.cfg;
    return `<div class="wrap"><div class="fg"><div><a class="logo" href="#inicio">${this.logo()}</a><p class="mu2">${t.fTag}</p><a href="${c.instagram}" target="_blank" rel="noopener">${t.follow}</a></div>
    <div><h4>${t.fNav}</h4>${this.navLinks(t)}</div><div><h4>${t.fCt}</h4><a href="https://wa.me/${c.wa}" target="_blank" rel="noopener">${c.phone}</a><a href="mailto:${c.email}">${c.email}</a></div></div>
    <div class="fb"><span>© ${new Date().getFullYear()} ${c.name} · ${t.rights}</span><button class="btn o" data-act="top">${t.top}</button></div></div>`;

/* ============ CONTROLLER: eventos, rotas, tema e idioma ============ */
const C = {
  view: null,
  $: (q) => document.querySelector(q),
  init() {
    const s = Model.state; let l = null, th = null;
    try { l = localStorage.getItem("lang"); th = localStorage.getItem("theme"); } catch (e) {}
    s.lang = l === "en" ? "en" : "pt";
    s.theme = th || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    this.apply();
    document.addEventListener("click", (e) => this.onClick(e));
    addEventListener("hashchange", () => this.route());
    this.route();
  },
  apply() {
    const s = Model.state, d = document.documentElement;
    d.dataset.theme = s.theme; d.lang = s.lang === "pt" ? "pt-BR" : "en";
    try { localStorage.setItem("lang", s.lang); localStorage.setItem("theme", s.theme); } catch (e) {}
  },
  route() {
    const h = location.hash.slice(1), v = h === "outros-projetos" ? "more" : "home", changed = v !== this.view;
    this.view = v;
    if (changed) this.render(true);
    if (v === "more") scrollTo(0, 0);
    else if (changed) { const el = h && document.getElementById(h); el ? el.scrollIntoView() : scrollTo(0, 0); }
  },
  render(animate) {
    const s = Model.state, t = Model.text[s.lang], vals = [...document.querySelectorAll("#cf [name]")].map((i) => i.value);
    this.$("#hdr").innerHTML = V.header(t, s);
    this.$("#app").innerHTML = this.view === "more" ? V.more(t) : V.home(t, s);
    this.$("#ftr").innerHTML = V.footer(t);
    document.querySelectorAll("#cf [name]").forEach((i, k) => { if (vals[k]) i.value = vals[k]; });
    if (animate) { const a = this.$("#app"); a.classList.remove("pg"); void a.offsetWidth; a.classList.add("pg"); }
    this.observe();
  },
  observe() {
    this.io && this.io.disconnect(); this.so && this.so.disconnect();
    this.io = new IntersectionObserver((es) => es.forEach((e) => e.target.classList.toggle("in", e.isIntersecting)), { threshold: .12, rootMargin: "0px 0px -6% 0px" });
    document.querySelectorAll(".rv").forEach((el) => this.io.observe(el));
    this.so = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) document.querySelectorAll("#nav a").forEach((a) => a.toggleAttribute("aria-current", a.getAttribute("href") === "#" + e.target.id)); }), { rootMargin: "-45% 0px -50% 0px" });
    document.querySelectorAll("[data-sec]").forEach((el) => this.so.observe(el));
  },
  onClick(e) {
    if (e.target.closest("#nav a")) this.closeMenu();
    const b = e.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act, s = Model.state;
    if (a === "lang") { s.lang = s.lang === "pt" ? "en" : "pt"; this.apply(); this.render(); }
    else if (a === "theme") { s.theme = s.theme === "dark" ? "light" : "dark"; this.apply(); }
    else if (a === "menu") { const o = this.$("#nav").classList.toggle("open"); b.setAttribute("aria-expanded", o); }
    else if (a === "top") scrollTo({ top: 0 });
    else this.send(a);
  },
  closeMenu() { this.$("#nav").classList.remove("open"); const b = this.$(".burger"); b && b.setAttribute("aria-expanded", "false"); },
  send(kind) {
    const f = this.$("#cf"), c = Model.cfg, t = Model.text[Model.state.lang];
    f.email.required = kind === "mail";
    if (!f.reportValidity()) return;
    const d = new FormData(f), body = `${t.fName}: ${d.get("name")}\n${t.fPhone}: ${d.get("phone")}\n${t.fMail}: ${d.get("email")}\n\n${d.get("message")}`;
    if (kind === "mail") location.href = `mailto:${c.email}?subject=${encodeURIComponent(t.subj)}&body=${encodeURIComponent(body)}`;
    else window.open(`https://wa.me/${c.wa}?text=${encodeURIComponent(body)}`, "_blank", "noopener");
  }
};
C.init();
</script>
